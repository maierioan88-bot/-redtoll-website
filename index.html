<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Toll — Official Game Site</title>
  <meta name="description" content="Red Toll is a dark low-poly action-survival RPG featuring dungeon crawling, village defense, and brutal tactical combat.">
  <link rel="icon" type="image/png" href="1.png">
  <style>
    :root {
      --bg-dark: #0d0f12;
      --card-bg: #161a20;
      --accent-red: #b91c1c;
      --accent-hover: #dc2626;
      --steam-blue: #1b2838;
      --steam-hover: #2a475e;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #272d37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1080px;
      padding: 2.5rem 1.5rem;
    }

    .hero {
      text-align: center;
      padding: 4rem 1rem 3rem;
    }

    .game-logo {
      max-width: 340px;
      width: 100%;
      height: auto;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 0 25px rgba(0, 0, 0, 0.9));
    }

    .hero-tagline {
      font-size: 1.25rem;
      color: var(--text-muted);
      max-width: 620px;
      margin: 0 auto 2.5rem;
    }

    .cta-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 3.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-steam {
      background-color: var(--steam-blue);
      color: #fff;
      border: 1px solid #38536f;
    }

    .btn-steam:hover {
      background-color: var(--steam-hover);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      border-color: var(--accent-red);
      color: #fff;
      transform: translateY(-2px);
    }

    .section-title {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.25rem;
      margin-bottom: 4rem;
    }

    .screenshot-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }

    .screenshot-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .screenshot-card:hover img {
      transform: scale(1.03);
    }

    footer {
      width: 100%;
      border-top: 1px solid var(--border-color);
      padding: 2rem 1.5rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    .footer-links {
      margin-top: 0.5rem;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
    }

    .footer-links a:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="hero">
      <!-- Logo remains pointed to the banner/mark you uploaded -->
      <img src="1.png" alt="Red Toll Logo" class="game-logo">
      <p class="hero-tagline">A dark low-poly action-survival RPG. Purge ancient crypts, defend the Village Cross, and survive the nightly siege.</p>

      <div class="cta-group">
        <a href="https://store.steampowered.com" target="_blank" class="btn btn-steam">Wishlist on Steam</a>
        <a href="https://youtube.com" target="_blank" class="btn btn-secondary">YouTube Devlogs</a>
        <a href="https://reddit.com" target="_blank" class="btn btn-secondary">Reddit Community</a>
        <a href="https://discord.com" target="_blank" class="btn btn-secondary">Discord</a>
      </div>
    </header>

    <main>
      <h2 class="section-title">In-Game Footage</h2>
      <div class="gallery-grid">
        <div class="screenshot-card">
          <img src="2.png" alt="Red Toll In-Game Screenshot 2">
        </div>
        <div class="screenshot-card">
          <img src="3.png" alt="Red Toll In-Game Screenshot 3">
        </div>
        <div class="screenshot-card">
          <img src="4.png" alt="Red Toll In-Game Screenshot 4">
        </div>
        <div class="screenshot-card">
          <img src="5.png" alt="Red Toll In-Game Screenshot 5">
        </div>
        <div class="screenshot-card">
          <img src="6.png" alt="Red Toll In-Game Screenshot 6">
        </div>
        <div class="screenshot-card">
          <img src="7.png" alt="Red Toll In-Game Screenshot 7">
        </div>
        <div class="screenshot-card">
          <img src="8.png" alt="Red Toll In-Game Screenshot 8">
        </div>
        <div class="screenshot-card">
          <img src="9.png" alt="Red Toll In-Game Screenshot 9">
        </div>
      </div>
    </main>
  </div>

  <footer>
    <p>&copy; 2026 Red Toll. All rights reserved.</p>
    <div class="footer-links">
      <a href="mailto:contact@theredtoll.com">Press & Support Contact</a>
      <a href="#">Privacy Policy</a>
    </div>
  </footer>

</body>
</html>
