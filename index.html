<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Toll — Official Game Site</title>
  <meta name="description" content="Red Toll is a dark low-poly action-survival RPG featuring dungeon crawling, village defense, and brutal tactical combat.">
  <link rel="icon" type="image/png" href="images/icon.png">
  <style>
    :root {
      --bg-dark: #090b0e;
      --card-bg: #14181f;
      --accent-red: #b91c1c;
      --accent-hover: #dc2626;
      --steam-blue: #1b2838;
      --steam-hover: #2a475e;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #272d37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Hero section with the panoramic banner background */
    .hero-wrapper {
      width: 100%;
      background: linear-gradient(rgba(9, 11, 14, 0.5), var(--bg-dark)), url('images/hero_banner.png') center/cover no-repeat;
      display: flex;
      justify-content: center;
      border-bottom: 1px solid var(--border-color);
      padding: 6rem 1.5rem 4rem;
    }

    .hero-content {
      max-width: 800px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-logo {
      max-width: 380px;
      width: 100%;
      height: auto;
      margin-bottom: 2rem;
      filter: drop-shadow(0 0 35px rgba(0, 0, 0, 0.95));
    }

    .hero-tagline {
      font-size: 1.35rem;
      font-weight: 500;
      color: #e5e7eb;
      max-width: 650px;
      margin-bottom: 2.5rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .cta-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-steam {
      background-color: var(--steam-blue);
      color: #fff;
      border: 1px solid #38536f;
    }

    .btn-steam:hover {
      background-color: var(--steam-hover);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: rgba(20, 24, 31, 0.85);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(4px);
    }

    .btn-secondary:hover {
      border-color: var(--accent-red);
      color: #fff;
      transform: translateY(-2px);
    }

    .container {
      width: 100%;
      max-width: 1120px;
      padding: 4rem 1.5rem;
    }

    .section-title {
      font-size: 1.6rem;
      text-align: center;
      margin-bottom: 2rem;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .screenshot-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .screenshot-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .screenshot-card:hover img {
      transform: scale(1.04);
    }

    footer {
      width: 100%;
      border-top: 1px solid var(--border-color);
      padding: 2.5rem 1.5rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    .footer-links {
      margin-top: 0.75rem;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
    }

    .footer-links a:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- Header with Banner Background and Centered Logo -->
  <header class="hero-wrapper">
    <div class="hero-content">
      <img src="images/logo.png" alt="Red Toll Logo" class="game-logo">
      <p class="hero-tagline">A dark low-poly action-survival RPG. Purge ancient crypts, defend the Village Cross, and survive the nightly siege.</p>

      <div class="cta-group">
        <a href="https://store.steampowered.com" target="_blank" class="btn btn-steam">Wishlist on Steam</a>
        <a href="https://youtube.com" target="_blank" class="btn btn-secondary">YouTube Devlogs</a>
        <a href="https://reddit.com" target="_blank" class="btn btn-secondary">Reddit Community</a>
        <a href="https://discord.com" target="_blank" class="btn btn-secondary">Discord</a>
      </div>
    </div>
  </header>

  <div class="container">
    <main>
      <h2 class="section-title">In-Game Footage</h2>
      <div class="gallery-grid">
        <div class="screenshot-card">
          <img src="images/1.png" alt="Red Toll Gameplay 1">
        </div>
        <div class="screenshot-card">
          <img src="images/2.png" alt="Red Toll Gameplay 2">
        </div>
        <div class="screenshot-card">
          <img src="images/3.png" alt="Red Toll Gameplay 3">
        </div>
        <div class="screenshot-card">
          <img src="images/4.png" alt="Red Toll Gameplay 4">
        </div>
        <div class="screenshot-card">
          <img src="images/5.png" alt="Red Toll Gameplay 5">
        </div>
        <div class="screenshot-card">
          <img src="images/6.png" alt="Red Toll Gameplay 6">
        </div>
        <div class="screenshot-card">
          <img src="images/7.png" alt="Red Toll Gameplay 7">
        </div>
        <div class="screenshot-card">
          <img src="images/8.png" alt="Red Toll Gameplay 8">
        </div>
        <div class="screenshot-card">
          <img src="images/9.png" alt="Red Toll Gameplay 9">
        </div>
      </div>
    </main>
  </div>

  <footer>
    <p>&copy; 2026 Red Toll. All rights reserved.</p>
    <div class="footer-links">
      <a href="mailto:contact@theredtoll.com">Press & Support Contact</a>
      <a href="#">Privacy Policy</a>
    </div>
  </footer>

</body>
</html>
